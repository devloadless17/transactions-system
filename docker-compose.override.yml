# Local-only overrides (auto-merged by `docker compose`). Runs the prod-profile
# images on plain localhost — no TLS gateway — for local testing.
#
#   docker compose --profile prod up --build -d
#     → web  http://localhost:${WEB_PORT:-3000}
#     → api  http://localhost:${API_PORT:-3001}/v1
#
# Only the HOST side of those mappings moves with WEB_PORT/API_PORT; inside the
# compose network the containers stay on :3000 / :3001 (see docker-compose.yml).
#
# The API runs in development mode so the production-only env validation
# (which requires HTTPS, Secure cookies, a non-localhost cookie domain, and
# strong secrets) doesn't reject this localhost/http config. A real deployment
# runs NODE_ENV=production behind its own TLS — Caddy lives only on the server.
#
# Whish Pay credentials (WHISH_CHANNEL / WHISH_SECRET / WHISH_WEBSITE_URL / …)
# are forwarded by the base compose from .env, so nothing Whish is repeated here.
services:
  api:
    environment:
      NODE_ENV: development
