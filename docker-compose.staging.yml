# ============================================================================
# OPTIONAL staging stack — runs ALONGSIDE the live prod stack on the same host.
#
# It REUSES the exact same published images as prod (the web image is built
# domain-agnostic / same-origin, so no separate build is needed) but with:
#   • its own Postgres + Redis + volumes (zero shared data with prod),
#   • its own secrets and the Whish SANDBOX credentials,
#   • a different public hostname (staging.rivalpayments.com, proxied
#     by Cloudflare like prod),
#   • NO published host ports — the prod Caddy reaches it over the shared `edge`
#     network and terminates TLS, exactly like it does for prod.
#
# Run it as a SEPARATE compose project so volumes/networks never collide with
# prod, and point it at the staging env file:
#
#   docker network create edge            # once; shared with prod's Caddy
#   docker compose -p staging --env-file .env.staging -f docker-compose.staging.yml \
#     pull api-staging-blue web-staging migrate-staging
#   docker compose -p staging --env-file .env.staging -f docker-compose.staging.yml \
#     run --rm migrate-staging            # migrate / rotate RLS / seed
#   ./release-staging.sh staging          # the API (blue/green), then the web
#
# (.github/workflows/deploy-staging.yml does exactly this.) Never a bare `up -d`
# (it would start BOTH API colours) and never `--remove-orphans`.
#
# All service names carry a `-staging` suffix so their network aliases on `edge`
# never clash with the prod `api` / `web` aliases the prod Caddy also resolves.
# ============================================================================

# Hard-pin the compose project name so staging's volumes/networks are always
# `staging_*` and can NEVER be mistaken for the prod project (whose name derives
# from the deploy directory).
name: staging

# ----------------------------------------------------------------------------
# The staging API runs as TWO services, api-staging-blue and api-staging-green,
# with this one shared definition — exactly like prod (docker-compose.prod.yml,
# scripts/deploy/release.sh). Normally one runs; a release starts the new
# version beside it and drains the old one only once Caddy has seen the new one
# healthy. Both answer to `api-staging-pool` (the web server's own calls) and to
# `api-staging`, the name of the single container they replaced (on `edge`
# too, where the shared Caddy reaches them).
# ----------------------------------------------------------------------------
x-api-staging: &api
  image: ${DOCKER_USERNAME}/transactions-api:${IMAGE_TAG:-latest}
  restart: unless-stopped
  # Zero-loss shutdown (apps/api/src/common/http/graceful-drain.ts): on SIGTERM
  # the API leaves Caddy's rotation, finishes every request and background run
  # in flight, then exits — normally in ~3s. `init` delivers the signal to Node
  # properly; the grace period only bounds a request that never finishes.
  init: true
  stop_grace_period: 60s
  depends_on:
    postgres-staging:
      condition: service_healthy
    redis-staging:
      condition: service_healthy
  environment: &api-env
    NODE_ENV: production
    API_PORT: 3001
    API_HOST: 0.0.0.0
    API_GLOBAL_PREFIX: v1
    # connection_limit: the API's database connections (Prisma's own default is
    # 2 x CPU cores + 1 = 5 on this server, which a burst of link creations
    # exhausts — see TX_MAX_WAIT_MS in prisma.service.ts). Two colours run side
    # by side during a release, so 2 x 20 stays far under max_connections 100.
    DATABASE_URL: postgresql://${POSTGRES_USER_RLS:-txn_app_rls}:${POSTGRES_PASSWORD_RLS}@postgres-staging:5432/${POSTGRES_DB}?schema=public&connection_limit=${DATABASE_POOL_SIZE:-20}
    REDIS_URL: redis://redis-staging:6379
    JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
    JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
    CSRF_SECRET: ${CSRF_SECRET}
    COOKIE_DOMAIN: ${COOKIE_DOMAIN}
    COOKIE_SECURE: 'true'
    WEB_ORIGIN: ${WEB_ORIGIN}
    ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    API_PUBLIC_URL: ${API_PUBLIC_URL}
    METRICS_TOKEN: ${METRICS_TOKEN}
    # Source-ingest limiters. Absent = schema defaults (ingest UNLIMITED,
    # 20 failed auths/IP/min, Whish Pay API braked at 60000 link creations
    # and 300000 status lookups per key per minute). Listed
    # here so they are genuinely tunable from the server .env without a
    # code deploy — compose only passes through what it names.
    INGEST_RATE_LIMIT_MAX: ${INGEST_RATE_LIMIT_MAX:-0}
    AUTH_FAILURE_MAX_PER_MIN: ${AUTH_FAILURE_MAX_PER_MIN:-20}
    INTEGRATION_CREATE_RATE_LIMIT_MAX: ${INTEGRATION_CREATE_RATE_LIMIT_MAX:-60000}
    INTEGRATION_LOOKUP_RATE_LIMIT_MAX: ${INTEGRATION_LOOKUP_RATE_LIMIT_MAX:-300000}
    # Whish SANDBOX for staging. WHISH_ALLOW_SANDBOX=true lets the prod build
    # accept the sandbox base + (non-https) sandbox website URL.
    WHISH_BASE_URL: ${WHISH_BASE_URL}
    WHISH_CHANNEL: ${WHISH_CHANNEL:-}
    WHISH_SECRET: ${WHISH_SECRET:-}
    WHISH_WEBSITE_URL: ${WHISH_WEBSITE_URL}
    WHISH_CALLBACK_BASE: ${WHISH_CALLBACK_BASE}
    WHISH_USER_AGENT: '${WHISH_USER_AGENT}'
    WHISH_ENABLED_CURRENCIES: ${WHISH_ENABLED_CURRENCIES:-USD}
    WHISH_ALLOW_SANDBOX: ${WHISH_ALLOW_SANDBOX:-true}
    # Whish W2W (consumer-app) transfers. NO sandbox exists for W2W — these move
    # REAL money even on staging. Set WHISH_W2W_ENABLED / WHISH_W2W_ENC_KEY in
    # .env.staging on the server to use it; default OFF.
    WHISH_W2W_ENABLED: ${WHISH_W2W_ENABLED:-false}
    WHISH_W2W_ENC_KEY: ${WHISH_W2W_ENC_KEY:-}
    WHISH_W2W_BASE_URL: ${WHISH_W2W_BASE_URL:-https://api.whish.money/itel-service}
    # Staging-only: fake the auto-approval transfer — the pipeline runs with all
    # its rules (admin toggle, hold window, WISH/USD, cap) but approves with a
    # SIMULATED- reference instead of moving money. Mutually exclusive with
    # WHISH_W2W_ENABLED — the API refuses to boot with both. NOT passed through
    # in docker-compose.prod.yml, so production can never enable it.
    WITHDRAWAL_AUTO_APPROVAL_SIMULATE: ${WITHDRAWAL_AUTO_APPROVAL_SIMULATE:-true}
    # Telegram alerts for load/payout requests. Intentionally a PRODUCTION-only
    # feature: leave TELEGRAM_* UNSET in .env.staging so this no-ops on staging.
    # The passthrough mirrors prod only so the two compose files stay identical.
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
  healthcheck:
    test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3001/v1/health || exit 1']
    interval: 10s
    timeout: 5s
    retries: 6
    # Checked every second while starting, so a new release shows healthy
    # as soon as it is (the release script itself asks the API directly).
    start_period: 120s
    start_interval: 1s

services:
  postgres-staging:
    image: postgres:16-alpine
    container_name: txn_postgres_staging
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis-staging:
    image: redis:7-alpine
    container_name: txn_redis_staging
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data_staging:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: apply migrations, rotate the RLS role password, optionally seed.
  # Profile-gated so `up` never starts it — run it explicitly before `up`.
  migrate-staging:
    profiles: ['migrate']
    image: ${DOCKER_USERNAME}/transactions-api:${IMAGE_TAG:-latest}
    container_name: txn_migrate_staging
    restart: 'no'
    depends_on:
      postgres-staging:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_MIGRATIONS_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-staging:5432/${POSTGRES_DB}?schema=public
      POSTGRES_USER_RLS: ${POSTGRES_USER_RLS:-txn_app_rls}
      POSTGRES_PASSWORD_RLS: ${POSTGRES_PASSWORD_RLS}
      SEED_DATABASE: ${SEED_DATABASE:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      # Lets deploy.sh raise the Whish externalId sequence out of the shared-
      # sandbox collision range (see deploy.sh). A LITERAL 'true' (not a masked
      # secret) so the gate fires deterministically on every staging deploy.
      # Sandbox-only — prod's migrate service omits this, so its gate stays off
      # and the live Whish account is never touched.
      WHISH_SANDBOX_SEQ_FIX: 'true'
    command: ['sh', '/repo/packages/db/deploy.sh']

  api-staging-blue:
    <<: *api
    container_name: txn_api_staging_blue
    environment:
      <<: *api-env
      # Names this instance in job leases (src/database/job-lease.service.ts).
      API_INSTANCE: staging-blue
    networks:
      default:
        aliases: [api-staging, api-staging-pool]
      edge:
        aliases: [api-staging]

  api-staging-green:
    <<: *api
    container_name: txn_api_staging_green
    environment:
      <<: *api-env
      API_INSTANCE: staging-green
    networks:
      default:
        aliases: [api-staging, api-staging-pool]
      edge:
        aliases: [api-staging]

  web-staging:
    image: ${DOCKER_USERNAME}/transactions-web:${IMAGE_TAG:-latest}
    container_name: txn_web_staging
    restart: unless-stopped
    # Drains on SIGTERM and exits in seconds (apps/web/drain-server.cjs).
    init: true
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      PORT: 3000
      # Next.js standalone binds to $HOSTNAME, which Docker defaults to the
      # container ID — resolving to only ONE of this container's network IPs. Since
      # web-staging is on TWO networks (staging_default + edge), that leaves the
      # edge IP unbound and Caddy's dial gets "connection refused". Bind all
      # interfaces so Caddy can reach it over `edge`.
      HOSTNAME: '0.0.0.0'
      # SSR → staging API over the internal staging network, to whichever API
      # colour is running (both answer to `api-staging-pool`). The browser
      # resolves the API same-origin (https://staging.../v1) at runtime.
      API_INTERNAL_BASE_URL: http://api-staging-pool:3001/v1
    healthcheck:
      # Same as prod's web: `/` renders /login (asking the API for the session),
      # so a green check also proves web → API works.
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
      start_interval: 1s
    networks:
      - default
      - edge

volumes:
  postgres_data_staging:
  redis_data_staging:

networks:
  # Internal staging-only network (its postgres/redis/api/web talk here).
  default:
  # Shared bridge to the prod Caddy. External + pre-created (`docker network
  # create edge`); the prod stack attaches its Caddy to the same network.
  edge:
    external: true
