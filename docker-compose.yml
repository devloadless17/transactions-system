services:
  postgres:
    image: postgres:16-alpine
    container_name: txn_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-txn_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-txn_app_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-txn_system}
    ports:
      - '${POSTGRES_PORT:-5444}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-txn_app} -d ${POSTGRES_DB:-txn_system}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: txn_redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6391}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Prod profile: built images for the API and web. Start with:
  #   docker compose --profile prod up --build
  api:
    profiles: ['prod']
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: txn_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 3001
      API_HOST: 0.0.0.0
      API_GLOBAL_PREFIX: ${API_GLOBAL_PREFIX:-v1}
      # MUST be the non-superuser RLS role (NOT POSTGRES_USER, which is the
      # superuser that owns the tables and bypasses RLS). Decoupled so RLS is
      # actually enforced for the runtime API in the container.
      DATABASE_URL: postgresql://${POSTGRES_USER_RLS:-txn_app_rls}:${POSTGRES_PASSWORD_RLS:-txn_app_rls_dev_password}@postgres:5432/${POSTGRES_DB:-txn_system}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CSRF_SECRET: ${CSRF_SECRET}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-localhost}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      # Whish Pay (optional 3rd-party gateway). Forwarded from the host env so a
      # prod deploy is actually configured; empty by default = "not configured".
      WHISH_BASE_URL: ${WHISH_BASE_URL:-https://api.sandbox.whish.money/itel-service/api}
      WHISH_CHANNEL: ${WHISH_CHANNEL:-}
      WHISH_SECRET: ${WHISH_SECRET:-}
      WHISH_WEBSITE_URL: ${WHISH_WEBSITE_URL:-http://localhost:3000}
      WHISH_CALLBACK_BASE: ${WHISH_CALLBACK_BASE:-http://localhost:3001/v1}
      # User-Agent header sent on every Whish call, and the currencies Whish is
      # live for. Forwarded too — without these the container falls back to the
      # schema defaults and silently ignores the .env values.
      WHISH_USER_AGENT: '${WHISH_USER_AGENT:-Whish/1.0 (https://whish.money; support@whish.money)}'
      WHISH_ENABLED_CURRENCIES: ${WHISH_ENABLED_CURRENCIES:-USD}
    ports:
      - '${API_PORT:-3001}:3001'
    healthcheck:
      # 127.0.0.1 (not localhost): the API binds IPv4 0.0.0.0, but the image's
      # /etc/hosts maps localhost to ::1 too, and busybox wget hits IPv6 first
      # → connection refused. Pin IPv4 so the healthcheck reaches the server.
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3001/v1/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 6

  web:
    profiles: ['prod']
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: txn_web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001/v1}
      API_INTERNAL_BASE_URL: http://api:3001/v1
    ports:
      - '${WEB_PORT:-3000}:3000'

volumes:
  postgres_data:
  redis_data:
