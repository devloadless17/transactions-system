# Push to `staging` → typecheck → build & push the staging-tagged images →
#                     ship the staging compose → migrate → health-gate.
#
# Sibling of deploy.yml (which owns `main` → prod). This deploys the SECOND stack
# (docker-compose.staging.yml) onto the SAME server, in the `staging` compose
# project, against the Whish SANDBOX.
#
# Staging secrets are NOT in GitHub: they live in `.env.staging` ON THE SERVER
# (persistent, you maintain it). This workflow only ships code — it rebuilds the
# images from the `staging` branch and points the staging stack at them. The only
# secrets it needs are the SSH + Docker ones already used by prod.
name: Deploy to Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

# Don't let two staging deploys race; a newer push supersedes an in-flight one.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  DEPLOY_DIR: /home/deploy/transactions-system

jobs:
  # Same gate as prod: type errors, lint, and the unit suite must pass first.
  typecheck:
    name: Typecheck, Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm packages:build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  # Build the api + web images from the staging branch, tagged for staging only
  # (`:staging` floating + `:staging-<sha>` immutable). Prod's `:latest`/`:<sha>`
  # tags are never touched. Web is built with an EMPTY NEXT_PUBLIC_API_BASE_URL —
  # same as prod — so the browser resolves the API same-origin at runtime.
  build:
    name: Build & push (${{ matrix.app }})
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - app: api
            dockerfile: apps/api/Dockerfile
          - app: web
            dockerfile: apps/web/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_SECRET }}

      - name: Build & push ${{ matrix.app }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.app == 'web' && 'NEXT_PUBLIC_API_BASE_URL=' || '' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/transactions-${{ matrix.app }}:staging
            ${{ secrets.DOCKER_USERNAME }}/transactions-${{ matrix.app }}:staging-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    name: Ship & Deploy (staging)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate required secrets
        env:
          REQUIRED: |
            DOCKER_USERNAME DOCKER_SECRET VPS_HOST VPS_USER VPS_SSH_KEY_B64
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          missing=""
          for key in $REQUIRED; do
            val=$(printf '%s' "$SECRETS_JSON" | jq -r --arg k "$key" '.[$k] // ""')
            [ -z "$val" ] && missing="$missing $key"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required GitHub secret(s):$missing"
            exit 1
          fi
          echo "All required secrets present."

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare SSH key
        env:
          KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s' "$KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          head -1 ~/.ssh/deploy_key | grep -q "BEGIN OPENSSH PRIVATE KEY" \
            || { echo "::error::VPS_SSH_KEY_B64 did not decode to a valid private key"; exit 1; }
          echo "✓ SSH key decoded"

      - name: Wait for VPS SSH to be reachable
        env:
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          for i in $(seq 1 7); do
            if timeout 8 bash -c "exec 3<>/dev/tcp/$HOST/$PORT" 2>/dev/null; then
              echo "✓ $HOST:$PORT reachable (attempt $i/7)"
              exit 0
            fi
            echo "… $HOST:$PORT unreachable (attempt $i/7) — likely Hostinger edge scrub; retrying in 8s"
            sleep 8
          done
          echo "::error::$HOST:$PORT never became reachable (~2 min). Re-run for a fresh runner IP."
          exit 1

      - name: Ship & deploy
        env:
          HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_SECRET: ${{ secrets.DOCKER_SECRET }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -e
          KEY=~/.ssh/deploy_key
          COMMON="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

          echo "==> Copying staging compose + release script to $SSH_USER@$HOST:$DEPLOY_DIR"
          scp -i "$KEY" -P "$PORT" $COMMON \
            docker-compose.staging.yml \
            "$SSH_USER@$HOST:$DEPLOY_DIR/"
          # Its own copy (release-staging.sh), so production always runs the copy
          # its own pipeline shipped — staging is usually a release ahead.
          scp -i "$KEY" -P "$PORT" $COMMON \
            scripts/deploy/release.sh "$SSH_USER@$HOST:$DEPLOY_DIR/release-staging.sh"

          echo "==> Deploying staging stack"
          # Secret over STDIN, not argv (argv is readable via `ps` on the VPS).
          # Same construct as the prod deploy; verified with %q round-trip.
          REMOTE_SCRIPT="$(cat <<'REMOTE'
          set -e
          cd "$DEPLOY_DIR"

          # Staging secrets live here (persistent, not rendered by CI). Fail loudly
          # if it's missing rather than booting with prod's .env by mistake.
          if [ ! -f .env.staging ]; then
            echo "::error::.env.staging not found in $DEPLOY_DIR — create it (see STAGING.md) before deploying staging."
            exit 1
          fi

          # Point the staging stack at this commit's immutable image tag: the
          # release starts exactly these images (the API colour, then the web).
          # APPEND the line if .env.staging doesn't already have it — otherwise the
          # sed silently matches nothing and the stack keeps running a stale
          # `:latest` image (every deploy looks green but ships nothing).
          if grep -q '^IMAGE_TAG=' .env.staging; then
            sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=staging-$GITHUB_SHA|" .env.staging
          else
            printf '\nIMAGE_TAG=staging-%s\n' "$GITHUB_SHA" >> .env.staging
          fi

          SC="docker compose -p staging --env-file .env.staging -f docker-compose.staging.yml"

          echo "$DOCKER_SECRET" | docker login -u "$DOCKER_USERNAME" --password-stdin

          # Only the images this release ships; Postgres and Redis are never pulled
          # or recreated by a deploy.
          echo "==> Pulling staging images"
          # Docker Hub answers 502/429 now and then (it failed this deploy on
          # 2026-10-13). Nothing has changed yet at this point, so just try again.
          for attempt in 1 2 3 4; do
            $SC pull api-staging-blue web-staging migrate-staging </dev/null && break
            if [ "$attempt" = 4 ]; then
              echo "::error::Could not pull the staging images after 4 attempts. Nothing was changed."
              exit 1
            fi
            echo "  pull failed (attempt $attempt/4) — retrying in 15s"
            sleep 15
          done
          # Started if missing, never recreated, healthy before the migrations
          # (--wait gives them the order `depends_on` gave). The migrations run
          # with --no-deps: without it `run` recreates Postgres whenever its config
          # fingerprint changed (a Compose upgrade did, 2026-10-13/14) — see deploy.yml.
          $SC up -d --no-deps --no-recreate --wait --wait-timeout 180 postgres-staging redis-staging </dev/null

          echo "==> Migrations / RLS rotation (staging DB)"
          $SC run --rm -T --no-deps migrate-staging </dev/null

          # Blue/green, exactly like prod (scripts/deploy/release.sh): the new API
          # starts beside the live one and takes traffic only once Caddy has seen it
          # healthy; then the old one drains, then the web is swapped.
          echo "==> Releasing (API blue/green, then the web)"
          chmod +x release-staging.sh
          ./release-staging.sh staging </dev/null

          $SC ps
          REMOTE
          )"
          { printf 'DOCKER_SECRET=%q\n' "$DOCKER_SECRET"; printf '%s\n' "$REMOTE_SCRIPT"; } | \
            ssh -i "$KEY" -p "$PORT" $COMMON \
              "$SSH_USER@$HOST" \
              "DEPLOY_DIR='$DEPLOY_DIR' DOCKER_USERNAME='$DOCKER_USERNAME' GITHUB_SHA='$GITHUB_SHA' bash -s"
