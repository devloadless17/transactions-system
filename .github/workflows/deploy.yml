# PR → typecheck + lint only.
# Push to main (or manual run) → typecheck → build & push both images →
#                                ship to the VPS → migrate/seed → health-gate.
#
# Single workflow: the typecheck job runs on every event; the build-and-deploy
# job is gated to non-PR events, so PRs never touch the server.
name: Deploy to Production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      seed_database:
        description: 'Seed the database (first deploy only — creates the super admin)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Deploy target dir on the VPS (owned by the VPS_USER deploy user).
  DEPLOY_DIR: /home/deploy/transactions-system

jobs:
  # ---------------------------------------------------------------
  # Runs on EVERY event (PR + push). PRs stop here.
  # ---------------------------------------------------------------
  typecheck:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # No --ignore-scripts: @prisma/client's postinstall generates the client
      # (skipping it makes `@prisma/client` export nothing → packages:build fails).
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm packages:build
      - run: pnpm typecheck
      - run: pnpm lint

  # ---------------------------------------------------------------
  # Build + ship. Skipped on pull_request; needs typecheck green.
  # ---------------------------------------------------------------
  build-and-deploy:
    name: Build, Push & Deploy
    if: github.event_name != 'pull_request'
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Fail fast with a clear message if a required secret is missing.
      - name: Validate required secrets
        env:
          REQUIRED: |
            DOCKER_USERNAME DOCKER_SECRET VPS_HOST VPS_USER VPS_SSH_KEY DOMAIN
            POSTGRES_PASSWORD POSTGRES_PASSWORD_RLS
            JWT_ACCESS_SECRET JWT_REFRESH_SECRET CSRF_SECRET METRICS_TOKEN
            SEED_ADMIN_EMAIL SEED_ADMIN_PASSWORD
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          missing=""
          for key in $REQUIRED; do
            val=$(printf '%s' "$SECRETS_JSON" | jq -r --arg k "$key" '.[$k] // ""')
            [ -z "$val" ] && missing="$missing $key"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required GitHub secret(s):$missing"
            exit 1
          fi
          echo "All required secrets present."

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_SECRET }}

      # Build & push both images (latest + commit SHA for rollbacks).
      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/transactions-api:latest
            ${{ secrets.DOCKER_USERNAME }}/transactions-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build & push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          # NEXT_PUBLIC_* is inlined into the browser bundle at BUILD time, so the
          # production API URL must be baked here (same-origin: https://DOMAIN/v1).
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://${{ secrets.DOMAIN }}/v1
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/transactions-web:latest
            ${{ secrets.DOCKER_USERNAME }}/transactions-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # ---------------------------------------------------------------
      # Wait out Hostinger's edge DDoS scrubbing.
      #
      # Hostinger runs always-on edge scrubbing IN FRONT of the VPS. GitHub's
      # shared runner IPs (Azure) intermittently get flagged and their SYNs are
      # silently dropped (-> "dial tcp :22: i/o timeout") — invisible to ufw/sshd
      # because the packets never reach the host. The scrub window is short
      # (~1-2 min), so poll the SSH port from THIS runner until it clears before t
      # the scp/ssh steps run. If it never clears (~5 min), fail — a re-run draws
      # a fresh runner IP.
      #
      # Tip: set the VPS_PORT secret to a non-22 SSH port — Hostinger's edge
      # brute-force scrubbing targets 22, so a custom port usually bypasses it.
      # ---------------------------------------------------------------
      - name: Wait for VPS SSH to be reachable
        env:
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          for i in $(seq 1 20); do
            if timeout 8 bash -c "exec 3<>/dev/tcp/$HOST/$PORT" 2>/dev/null; then
              echo "✓ $HOST:$PORT reachable (attempt $i/20)"
              exit 0
            fi
            echo "… $HOST:$PORT unreachable (attempt $i/20) — likely Hostinger edge scrub on this runner IP; retrying in 15s"
            sleep 15
          done
          echo "::error::$HOST:$PORT never became reachable (~5 min) — sustained edge scrub. Re-run for a fresh runner IP, set VPS_PORT to a non-22 port, or use a self-hosted runner."
          exit 1

      # Ship deploy files + render the server-side .env from secrets.
      - name: Copy deploy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          source: 'docker-compose.prod.yml,Caddyfile,.env.prod.example'
          target: ${{ env.DEPLOY_DIR }}

      - name: Render .env from secrets
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script: |
            set -e
            cd ${{ env.DEPLOY_DIR }}
            cp .env.prod.example .env
            sed -i "s|__DOCKER_USERNAME__|${{ secrets.DOCKER_USERNAME }}|g" .env
            sed -i "s|__DOMAIN__|${{ secrets.DOMAIN }}|g" .env
            sed -i "s|__POSTGRES_PASSWORD__|${{ secrets.POSTGRES_PASSWORD }}|g" .env
            sed -i "s|__POSTGRES_PASSWORD_RLS__|${{ secrets.POSTGRES_PASSWORD_RLS }}|g" .env
            sed -i "s|__JWT_ACCESS_SECRET__|${{ secrets.JWT_ACCESS_SECRET }}|g" .env
            sed -i "s|__JWT_REFRESH_SECRET__|${{ secrets.JWT_REFRESH_SECRET }}|g" .env
            sed -i "s|__CSRF_SECRET__|${{ secrets.CSRF_SECRET }}|g" .env
            sed -i "s|__METRICS_TOKEN__|${{ secrets.METRICS_TOKEN }}|g" .env
            sed -i "s|__SEED_ADMIN_EMAIL__|${{ secrets.SEED_ADMIN_EMAIL }}|g" .env
            sed -i "s|__SEED_ADMIN_PASSWORD__|${{ secrets.SEED_ADMIN_PASSWORD }}|g" .env
            sed -i "s|__WHISH_CHANNEL__|${{ secrets.WHISH_CHANNEL }}|g" .env
            sed -i "s|__WHISH_SECRET__|${{ secrets.WHISH_SECRET }}|g" .env
            sed -i "s|^SEED_DATABASE=false|SEED_DATABASE=${{ github.event.inputs.seed_database || 'false' }}|g" .env
            chmod 600 .env

      # Pull images, run DB migrate/seed, bring the stack up, health-gate.
      # The VPS_USER is in the `docker` group, so no sudo is needed.
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          command_timeout: 20m
          script: |
            set -e
            cd ${{ env.DEPLOY_DIR }}

            echo "${{ secrets.DOCKER_SECRET }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            echo "==> Pulling images"
            docker compose -f docker-compose.prod.yml pull

            echo "==> Running migrations / RLS rotation / seed"
            docker compose -f docker-compose.prod.yml run --rm migrate

            echo "==> Starting stack"
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            docker image prune -f

            echo "==> Waiting for API to become healthy"
            RETRIES=0; MAX=45
            until [ "$RETRIES" -ge "$MAX" ]; do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' txn_api 2>/dev/null || echo "starting")
              if [ "$STATUS" = "healthy" ]; then echo "API is healthy!"; break; fi
              RETRIES=$((RETRIES + 1))
              echo "  ...($RETRIES/$MAX) status=$STATUS"
              sleep 4
            done

            if [ "$RETRIES" -ge "$MAX" ]; then
              echo "::error::API did not become healthy in time. Recent logs:"
              docker compose -f docker-compose.prod.yml logs --tail 80 api
              exit 1
            fi

            docker compose -f docker-compose.prod.yml ps
