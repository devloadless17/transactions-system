# PR → typecheck + lint only.
# Push to main (or manual run) → typecheck → build & push both images →
#                                ship to the VPS → migrate/seed → health-gate.
#
# Single workflow: the typecheck job runs on every event; the build-and-deploy
# job is gated to non-PR events, so PRs never touch the server.
#
# SSH auth: the deploy key is stored base64-encoded (single line) in the
# VPS_SSH_KEY_B64 secret — a single line can't get its newlines mangled on
# paste, which is what broke the multi-line VPS_SSH_KEY. We decode it to a file
# and use plain ssh/scp (no appleboy key-parsing quirks).
name: Deploy to Production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      seed_database:
        description: 'Seed the database (first deploy only — creates the super admin)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Deploy target dir on the VPS (owned by the VPS_USER deploy user).
  DEPLOY_DIR: /home/deploy/transactions-system

jobs:
  # ---------------------------------------------------------------
  # Runs on EVERY event (PR + push). PRs stop here.
  # ---------------------------------------------------------------
  typecheck:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # No --ignore-scripts: @prisma/client's postinstall generates the client
      # (skipping it makes `@prisma/client` export nothing → packages:build fails).
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm packages:build
      - run: pnpm typecheck
      - run: pnpm lint

  # ---------------------------------------------------------------
  # Build + ship. Skipped on pull_request; needs typecheck green.
  # ---------------------------------------------------------------
  build-and-deploy:
    name: Build, Push & Deploy
    if: github.event_name != 'pull_request'
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Fail fast with a clear message if a required secret is missing.
      - name: Validate required secrets
        env:
          REQUIRED: |
            DOCKER_USERNAME DOCKER_SECRET VPS_HOST VPS_USER VPS_SSH_KEY_B64 DOMAIN
            POSTGRES_PASSWORD POSTGRES_PASSWORD_RLS
            JWT_ACCESS_SECRET JWT_REFRESH_SECRET CSRF_SECRET METRICS_TOKEN
            SEED_ADMIN_EMAIL SEED_ADMIN_PASSWORD
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          missing=""
          for key in $REQUIRED; do
            val=$(printf '%s' "$SECRETS_JSON" | jq -r --arg k "$key" '.[$k] // ""')
            [ -z "$val" ] && missing="$missing $key"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required GitHub secret(s):$missing"
            exit 1
          fi
          echo "All required secrets present."

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_SECRET }}

      # Build & push both images (latest + commit SHA for rollbacks).
      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/transactions-api:latest
            ${{ secrets.DOCKER_USERNAME }}/transactions-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build & push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          # NEXT_PUBLIC_* is inlined into the browser bundle at BUILD time, so the
          # production API URL must be baked here (same-origin: https://DOMAIN/v1).
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://${{ secrets.DOMAIN }}/v1
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/transactions-web:latest
            ${{ secrets.DOCKER_USERNAME }}/transactions-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # ---------------------------------------------------------------
      # Decode the SSH key (base64 single-line secret → no newline mangling).
      # ---------------------------------------------------------------
      - name: Prepare SSH key
        env:
          KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s' "$KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          head -1 ~/.ssh/deploy_key | grep -q "BEGIN OPENSSH PRIVATE KEY" \
            || { echo "::error::VPS_SSH_KEY_B64 did not decode to a valid private key"; exit 1; }
          echo "✓ SSH key decoded"

      # ---------------------------------------------------------------
      # Wait out Hostinger's edge DDoS scrubbing (poll the SSH port until the
      # runner IP clears). The scrub targets 22; set VPS_PORT to a non-22 port
      # (e.g. 2222) to bypass it entirely.
      # ---------------------------------------------------------------
      - name: Wait for VPS SSH to be reachable
        env:
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          for i in $(seq 1 20); do
            if timeout 8 bash -c "exec 3<>/dev/tcp/$HOST/$PORT" 2>/dev/null; then
              echo "✓ $HOST:$PORT reachable (attempt $i/20)"
              exit 0
            fi
            echo "… $HOST:$PORT unreachable (attempt $i/20) — likely Hostinger edge scrub; retrying in 15s"
            sleep 15
          done
          echo "::error::$HOST:$PORT never became reachable (~5 min). Re-run for a fresh runner IP or set VPS_PORT to a non-22 port."
          exit 1

      # ---------------------------------------------------------------
      # Render .env from secrets ON THE RUNNER, then ship config + .env
      # and deploy — all over plain ssh/scp.
      # ---------------------------------------------------------------
      - name: Render .env
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOMAIN: ${{ secrets.DOMAIN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_PASSWORD_RLS: ${{ secrets.POSTGRES_PASSWORD_RLS }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          CSRF_SECRET: ${{ secrets.CSRF_SECRET }}
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          WHISH_CHANNEL: ${{ secrets.WHISH_CHANNEL }}
          WHISH_SECRET: ${{ secrets.WHISH_SECRET }}
          # Whish env/website default to LIVE when their secrets are unset; set the
          # sandbox values + WHISH_ALLOW_SANDBOX=true to test the sandbox on prod.
          WHISH_BASE_URL: ${{ secrets.WHISH_BASE_URL || 'https://api.whish.money/itel-service/api' }}
          WHISH_WEBSITE_URL: ${{ secrets.WHISH_WEBSITE_URL || format('https://{0}', secrets.DOMAIN) }}
          WHISH_ALLOW_SANDBOX: ${{ secrets.WHISH_ALLOW_SANDBOX || 'false' }}
          SEED_DATABASE: ${{ github.event.inputs.seed_database || 'false' }}
        run: |
          cp .env.prod.example .env.rendered
          # Pin the stack to THIS commit's immutable image tag (built+pushed above)
          # instead of the floating :latest. Two payoffs:
          #   1. `up -d` always sees a changed image ref → reliably recreates api/web.
          #   2. the tag IS the version, so rollback = redeploy the previous SHA.
          sed -i "s|^IMAGE_TAG=latest|IMAGE_TAG=$GITHUB_SHA|" .env.rendered
          sed -i "s|__DOCKER_USERNAME__|$DOCKER_USERNAME|g" .env.rendered
          sed -i "s|__DOMAIN__|$DOMAIN|g" .env.rendered
          sed -i "s|__POSTGRES_PASSWORD__|$POSTGRES_PASSWORD|g" .env.rendered
          sed -i "s|__POSTGRES_PASSWORD_RLS__|$POSTGRES_PASSWORD_RLS|g" .env.rendered
          sed -i "s|__JWT_ACCESS_SECRET__|$JWT_ACCESS_SECRET|g" .env.rendered
          sed -i "s|__JWT_REFRESH_SECRET__|$JWT_REFRESH_SECRET|g" .env.rendered
          sed -i "s|__CSRF_SECRET__|$CSRF_SECRET|g" .env.rendered
          sed -i "s|__METRICS_TOKEN__|$METRICS_TOKEN|g" .env.rendered
          sed -i "s|__SEED_ADMIN_EMAIL__|$SEED_ADMIN_EMAIL|g" .env.rendered
          sed -i "s|__SEED_ADMIN_PASSWORD__|$SEED_ADMIN_PASSWORD|g" .env.rendered
          sed -i "s|__WHISH_CHANNEL__|$WHISH_CHANNEL|g" .env.rendered
          sed -i "s|__WHISH_SECRET__|$WHISH_SECRET|g" .env.rendered
          sed -i "s|__WHISH_BASE_URL__|$WHISH_BASE_URL|g" .env.rendered
          sed -i "s|__WHISH_WEBSITE_URL__|$WHISH_WEBSITE_URL|g" .env.rendered
          sed -i "s|__WHISH_ALLOW_SANDBOX__|$WHISH_ALLOW_SANDBOX|g" .env.rendered
          sed -i "s|^SEED_DATABASE=false|SEED_DATABASE=$SEED_DATABASE|g" .env.rendered

      - name: Ship & deploy
        env:
          HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_SECRET: ${{ secrets.DOCKER_SECRET }}
        run: |
          set -e
          KEY=~/.ssh/deploy_key
          COMMON="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

          echo "==> Copying files to $SSH_USER@$HOST:$DEPLOY_DIR"
          scp -i "$KEY" -P "$PORT" $COMMON \
            docker-compose.prod.yml Caddyfile rollback.sh .env.rendered \
            "$SSH_USER@$HOST:$DEPLOY_DIR/"

          echo "==> Activating .env + deploying"
          ssh -i "$KEY" -p "$PORT" $COMMON \
            "$SSH_USER@$HOST" \
            "DEPLOY_DIR='$DEPLOY_DIR' DOCKER_USERNAME='$DOCKER_USERNAME' DOCKER_SECRET='$DOCKER_SECRET' bash -s" <<'REMOTE'
          set -e
          cd "$DEPLOY_DIR"
          mv -f .env.rendered .env
          chmod 600 .env
          chmod +x rollback.sh 2>/dev/null || true

          # Tag of the release currently running (empty on the very first deploy).
          # If the new release proves healthy this becomes the rollback target.
          PREV_TAG="$(cat .deploy_current 2>/dev/null || true)"
          NEW_TAG="$(grep -E '^IMAGE_TAG=' .env | cut -d= -f2)"

          echo "$DOCKER_SECRET" | docker login -u "$DOCKER_USERNAME" --password-stdin

          echo "==> Pulling images"
          docker compose -f docker-compose.prod.yml pull

          # -T detaches stdin. WITHOUT it, `docker compose run` attaches to stdin and
          # consumes the rest of THIS heredoc script (it's piped into `bash -s` over
          # ssh), so everything below — including `up -d` — silently never ran. That
          # made the deploy go green while the containers stayed on the old image.
          echo "==> Migrations / RLS rotation / seed"
          docker compose -f docker-compose.prod.yml run --rm -T migrate

          # IMAGE_TAG is pinned to this commit's SHA, so only api/web (whose image ref
          # changed) get recreated. postgres/redis/caddy keep running untouched — the
          # data volumes are never recreated, so nothing in the DB is lost.
          echo "==> Starting stack"
          docker compose -f docker-compose.prod.yml up -d --remove-orphans

          echo "==> Waiting for API health"
          RETRIES=0; MAX=45
          until [ "$RETRIES" -ge "$MAX" ]; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' txn_api 2>/dev/null || echo "starting")
            [ "$STATUS" = "healthy" ] && { echo "API is healthy!"; break; }
            RETRIES=$((RETRIES + 1)); echo "  ...($RETRIES/$MAX) status=$STATUS"; sleep 4
          done
          if [ "$RETRIES" -ge "$MAX" ]; then
            echo "API did not become healthy in time:"
            docker compose -f docker-compose.prod.yml logs --tail 80 api
            echo "::error::New release is unhealthy. Old image kept — run ./rollback.sh on the server to revert."
            exit 1
          fi

          # Healthy: commit the rollback pointer, then drop images we no longer need.
          # We keep the new release + the previous one (for rollback) + the floating
          # :latest, and remove everything older so disk doesn't grow unbounded.
          echo "==> Healthy — recording rollback pointer + pruning stale images"
          echo "$NEW_TAG" > .deploy_current
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$NEW_TAG" ]; then
            echo "$PREV_TAG" > .deploy_previous
          fi
          KEEP=" $NEW_TAG $PREV_TAG latest "
          for repo in "$DOCKER_USERNAME/transactions-api" "$DOCKER_USERNAME/transactions-web"; do
            docker images "$repo" --format '{{.Tag}}' | sort -u | while read -r t; do
              case "$KEEP" in
                *" $t "*) : ;;                                   # keep current/previous/latest
                *) docker rmi "$repo:$t" >/dev/null 2>&1 || true ;;  # in-use ones are skipped
              esac
            done
          done
          docker image prune -f >/dev/null 2>&1 || true

          docker compose -f docker-compose.prod.yml ps
          REMOTE
