# ONLY the `production` branch deploys to the live site. `main` is the safe
# integration branch: it runs CI but never touches the server.
#
#   PR → main|production          → typecheck + lint + test only
#   Push to main                  → typecheck + lint + test only (NO deploy)
#   Push to production            → typecheck → build & push both images →
#                                   ship to the VPS → migrate/seed → health-gate
#   Manual run (workflow_dispatch)→ only deploys when run FROM the `production`
#                                   branch; from main it just runs the checks.
#
# Single workflow: the typecheck job runs on every event; build + deploy are
# gated on `github.ref == refs/heads/production`, so neither a PR nor a push to
# main can ever reach the server. To release: `git push origin main:production`.
#
# SSH auth: the deploy key is stored base64-encoded (single line) in the
# VPS_SSH_KEY_B64 secret — a single line can't get its newlines mangled on
# paste, which is what broke the multi-line VPS_SSH_KEY. We decode it to a file
# and use plain ssh/scp (no appleboy key-parsing quirks).
name: CI & Deploy to Production

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]
  workflow_dispatch:
    inputs:
      seed_database:
        description: 'Seed the database (first deploy only — creates the super admin)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Deploy target dir on the VPS (owned by the VPS_USER deploy user).
  DEPLOY_DIR: /home/deploy/transactions-system

jobs:
  # ---------------------------------------------------------------
  # Runs on EVERY event (PR + push). PRs stop here.
  # ---------------------------------------------------------------
  typecheck:
    name: Typecheck, Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # No --ignore-scripts: @prisma/client's postinstall generates the client
      # (skipping it makes `@prisma/client` export nothing → packages:build fails).
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm packages:build
      - run: pnpm typecheck
      - run: pnpm lint
      # Gate every PR + deploy on the unit suite (infra-free, ~1.4s): catches
      # logic regressions — wrong fee split, broken idempotency, off-by-one in
      # reserved math — that still type-check and would otherwise ship to prod.
      # (The DB-backed integration suite stays opt-in; it needs a Postgres + RLS
      # role, so it isn't wired into this gate yet.)
      - run: pnpm test

  # ---------------------------------------------------------------
  # Build + push the api and web images IN PARALLEL — one matrix leg each, on
  # its own runner, so the slower (web / next build) no longer waits behind the
  # api. Runs ONLY on the production branch (never on a PR, never on main);
  # needs typecheck green.
  # ---------------------------------------------------------------
  build:
    name: Build & push (${{ matrix.app }})
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/production'
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - app: api
            dockerfile: apps/api/Dockerfile
          - app: web
            dockerfile: apps/web/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_SECRET }}

      # Tags: latest + commit SHA (the SHA tag is what the deploy pins to, for
      # rollbacks). The web image is built with an EMPTY NEXT_PUBLIC_API_BASE_URL
      # on purpose: the browser then resolves the API base same-origin at runtime
      # (window.location.origin + /v1, see apps/web/src/lib/api.ts:publicApiBase).
      # That makes the image domain-agnostic — the SAME image serves prod AND a
      # staging instance on a different subdomain with no rebuild. The api image
      # takes no build args.
      - name: Build & push ${{ matrix.app }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.app == 'web' && 'NEXT_PUBLIC_API_BASE_URL=' || '' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/transactions-${{ matrix.app }}:latest
            ${{ secrets.DOCKER_USERNAME }}/transactions-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # ---------------------------------------------------------------
  # Ship config, render .env, migrate, recreate the stack. Needs BOTH images
  # (the whole matrix build job) to have been pushed first. The production-branch
  # guard is repeated here deliberately (defence in depth): a skipped `build`
  # would already skip this job, but the condition makes the intent explicit.
  # ---------------------------------------------------------------
  deploy:
    name: Ship & Deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/production'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Fail fast with a clear message if a required secret is missing.
      - name: Validate required secrets
        env:
          REQUIRED: |
            DOCKER_USERNAME DOCKER_SECRET VPS_HOST VPS_USER VPS_SSH_KEY_B64 DOMAIN
            POSTGRES_PASSWORD POSTGRES_PASSWORD_RLS
            JWT_ACCESS_SECRET JWT_REFRESH_SECRET CSRF_SECRET METRICS_TOKEN
            SEED_ADMIN_EMAIL SEED_ADMIN_PASSWORD
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          missing=""
          for key in $REQUIRED; do
            val=$(printf '%s' "$SECRETS_JSON" | jq -r --arg k "$key" '.[$k] // ""')
            [ -z "$val" ] && missing="$missing $key"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required GitHub secret(s):$missing"
            exit 1
          fi
          echo "All required secrets present."

      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # Decode the SSH key (base64 single-line secret → no newline mangling).
      # ---------------------------------------------------------------
      - name: Prepare SSH key
        env:
          KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s' "$KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          head -1 ~/.ssh/deploy_key | grep -q "BEGIN OPENSSH PRIVATE KEY" \
            || { echo "::error::VPS_SSH_KEY_B64 did not decode to a valid private key"; exit 1; }
          echo "✓ SSH key decoded"

      # ---------------------------------------------------------------
      # Hostinger runs always-on edge DDoS scrubbing in front of the VPS: GitHub's
      # shared runner IPs intermittently get flagged and their SYNs are silently
      # dropped before they reach the host (→ connection timeout, invisible to
      # ufw/sshd — no failed-login line). It is IP-BASED, not port-based: moving
      # SSH off 22 does NOT avoid it (our other Hostinger deploy hits the same
      # scrub on port 22). The window is short (~1-2 min), so poll until the runner
      # IP clears instead of failing. A sustained block (rare) still exits non-zero
      # below, at which point a re-run draws a fresh IP. The real fix is to drop the
      # public-SSH hop entirely — a self-hosted runner on the VPS, or Tailscale.
      # ---------------------------------------------------------------
      - name: Wait for VPS SSH to be reachable
        env:
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          # Cap the wait at ~2 min (7 probes × ~16s): rides out the short ~1-2 min
          # scrub window, then fails fast so a re-run can draw a fresh runner IP
          # rather than blocking the job for 5 min.
          for i in $(seq 1 7); do
            if timeout 8 bash -c "exec 3<>/dev/tcp/$HOST/$PORT" 2>/dev/null; then
              echo "✓ $HOST:$PORT reachable (attempt $i/7)"
              exit 0
            fi
            echo "… $HOST:$PORT unreachable (attempt $i/7) — likely Hostinger edge scrub; retrying in 8s"
            sleep 8
          done
          echo "::error::$HOST:$PORT never became reachable (~2 min) — sustained Hostinger edge scrub. Re-run for a fresh runner IP, or move the deploy to a self-hosted runner / Tailscale to drop the public-SSH hop."
          exit 1

      # ---------------------------------------------------------------
      # Render .env from secrets ON THE RUNNER, then ship config + .env
      # and deploy — all over plain ssh/scp.
      # ---------------------------------------------------------------
      - name: Render .env
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOMAIN: ${{ secrets.DOMAIN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_PASSWORD_RLS: ${{ secrets.POSTGRES_PASSWORD_RLS }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          CSRF_SECRET: ${{ secrets.CSRF_SECRET }}
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          WHISH_CHANNEL: ${{ secrets.WHISH_CHANNEL }}
          WHISH_SECRET: ${{ secrets.WHISH_SECRET }}
          # Whish env/website default to LIVE when their secrets are unset; set the
          # sandbox values + WHISH_ALLOW_SANDBOX=true to test the sandbox on prod.
          WHISH_BASE_URL: ${{ secrets.WHISH_BASE_URL || 'https://api.whish.money/itel-service/api' }}
          WHISH_WEBSITE_URL: ${{ secrets.WHISH_WEBSITE_URL || format('https://{0}', secrets.DOMAIN) }}
          WHISH_ALLOW_SANDBOX: ${{ secrets.WHISH_ALLOW_SANDBOX || 'false' }}
          # Whish W2W (consumer-app) outbound transfers. OFF unless the secret is
          # explicitly 'true'. The session creds are entered in the UI (encrypted
          # at rest); only the flag + the AES-256-GCM key flow through here.
          WHISH_W2W_ENABLED: ${{ secrets.WHISH_W2W_ENABLED || 'false' }}
          WHISH_W2W_ENC_KEY: ${{ secrets.WHISH_W2W_ENC_KEY }}
          # Telegram alerts for load/payout requests (production-only feature).
          # Unset secrets render empty → placeholders become '' → feature off.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEED_DATABASE: ${{ github.event.inputs.seed_database || 'false' }}
        run: |
          cp .env.prod.example .env.rendered
          # Escape sed replacement metacharacters (\ & and the | delimiter) so a
          # free-form secret (operator-chosen admin password, provider-issued Whish
          # secret) that contains one can't corrupt the rendered .env.
          esc() { printf '%s' "$1" | sed -e 's/[\\&|]/\\&/g'; }
          # Pin the stack to THIS commit's immutable image tag (built+pushed above)
          # instead of the floating :latest. Two payoffs:
          #   1. `up -d` always sees a changed image ref → reliably recreates api/web.
          #   2. the tag IS the version, so rollback = redeploy the previous SHA.
          sed -i "s|^IMAGE_TAG=latest|IMAGE_TAG=$GITHUB_SHA|" .env.rendered
          sed -i "s|__DOCKER_USERNAME__|$DOCKER_USERNAME|g" .env.rendered
          sed -i "s|__DOMAIN__|$DOMAIN|g" .env.rendered
          sed -i "s|__POSTGRES_PASSWORD__|$POSTGRES_PASSWORD|g" .env.rendered
          sed -i "s|__POSTGRES_PASSWORD_RLS__|$POSTGRES_PASSWORD_RLS|g" .env.rendered
          sed -i "s|__JWT_ACCESS_SECRET__|$JWT_ACCESS_SECRET|g" .env.rendered
          sed -i "s|__JWT_REFRESH_SECRET__|$JWT_REFRESH_SECRET|g" .env.rendered
          sed -i "s|__CSRF_SECRET__|$CSRF_SECRET|g" .env.rendered
          sed -i "s|__METRICS_TOKEN__|$METRICS_TOKEN|g" .env.rendered
          sed -i "s|__SEED_ADMIN_EMAIL__|$SEED_ADMIN_EMAIL|g" .env.rendered
          sed -i "s|__SEED_ADMIN_PASSWORD__|$(esc "$SEED_ADMIN_PASSWORD")|g" .env.rendered
          sed -i "s|__WHISH_CHANNEL__|$WHISH_CHANNEL|g" .env.rendered
          sed -i "s|__WHISH_SECRET__|$(esc "$WHISH_SECRET")|g" .env.rendered
          sed -i "s|__WHISH_BASE_URL__|$WHISH_BASE_URL|g" .env.rendered
          sed -i "s|__WHISH_WEBSITE_URL__|$WHISH_WEBSITE_URL|g" .env.rendered
          sed -i "s|__WHISH_ALLOW_SANDBOX__|$WHISH_ALLOW_SANDBOX|g" .env.rendered
          sed -i "s|__WHISH_W2W_ENABLED__|$WHISH_W2W_ENABLED|g" .env.rendered
          sed -i "s|__WHISH_W2W_ENC_KEY__|$(esc "$WHISH_W2W_ENC_KEY")|g" .env.rendered
          sed -i "s|__TELEGRAM_BOT_TOKEN__|$(esc "$TELEGRAM_BOT_TOKEN")|g" .env.rendered
          sed -i "s|__TELEGRAM_CHAT_ID__|$(esc "$TELEGRAM_CHAT_ID")|g" .env.rendered
          sed -i "s|^SEED_DATABASE=false|SEED_DATABASE=$SEED_DATABASE|g" .env.rendered

      - name: Ship & deploy
        env:
          HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_SECRET: ${{ secrets.DOCKER_SECRET }}
        run: |
          set -e
          KEY=~/.ssh/deploy_key
          COMMON="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

          echo "==> Copying files to $SSH_USER@$HOST:$DEPLOY_DIR"
          # Not docker-compose.staging.yml: the staging pipeline ships its own, and
          # production lags staging, so this copy could be older than staging needs.
          scp -i "$KEY" -P "$PORT" $COMMON \
            docker-compose.prod.yml Caddyfile rollback.sh .env.rendered \
            "$SSH_USER@$HOST:$DEPLOY_DIR/"
          scp -i "$KEY" -P "$PORT" $COMMON \
            scripts/deploy/release.sh "$SSH_USER@$HOST:$DEPLOY_DIR/release.sh"

          echo "==> Activating .env + deploying"
          # The remote script is captured into a variable so DOCKER_SECRET can be
          # prepended over STDIN (printf %q) instead of riding the ssh argv —
          # argv is world-readable via `ps` on the VPS for the whole deploy.
          # (Construct verified: %q survives quotes/$()/backticks intact, and the
          # in-script `</dev/null` stdin guards keep working.)
          REMOTE_SCRIPT="$(cat <<'REMOTE'
          set -e
          cd "$DEPLOY_DIR"
          mv -f .env.rendered .env
          chmod 600 .env
          chmod +x rollback.sh release.sh

          # Tag of the release currently running (empty on the very first deploy).
          # If the new release proves healthy this becomes the rollback target.
          PREV_TAG="$(cat .deploy_current 2>/dev/null || true)"
          NEW_TAG="$(grep -E '^IMAGE_TAG=' .env | cut -d= -f2)"

          echo "$DOCKER_SECRET" | docker login -u "$DOCKER_USERNAME" --password-stdin

          # Only the images this release ships. Postgres, Redis and Caddy are never
          # pulled or recreated by a deploy (a floating tag's update would restart the
          # database or the edge in the middle of a release); updating them is a
          # deliberate step of its own (docs/server-operations.md).
          echo "==> Pulling images"
          # Docker Hub answers 502/429 now and then (it failed a staging deploy on
          # 2026-10-13). Nothing has changed yet at this point, so just try again.
          for attempt in 1 2 3 4; do
            docker compose -f docker-compose.prod.yml pull api-blue web migrate </dev/null && break
            if [ "$attempt" = 4 ]; then
              echo "::error::Could not pull the images after 4 attempts. Nothing was changed."
              exit 1
            fi
            echo "  pull failed (attempt $attempt/4) — retrying in 15s"
            sleep 15
          done
          docker compose -f docker-compose.prod.yml up -d --no-deps --no-recreate postgres redis caddy </dev/null

          # `</dev/null` is load-bearing. This whole script is piped into `bash -s`
          # over ssh, so the remote bash reads it from stdin. `docker compose run`
          # ATTACHES + DRAINS stdin (even with -T, which only disables the TTY), so
          # it swallows the rest of THIS script — `up -d` and everything below never
          # ran, and the deploy went green with the containers left on the old image.
          # Redirecting stdin to /dev/null severs it from the heredoc. (-T kept too.)
          echo "==> Migrations / RLS rotation / seed"
          docker compose -f docker-compose.prod.yml run --rm -T migrate </dev/null

          # The shipped Caddyfile is loaded by the release itself (release.sh), once
          # the new API colour runs and only if the file changed — never before,
          # when it could name a colour that isn't running yet.

          # Blue/green: the new API starts BESIDE the live one, takes traffic only
          # once Caddy has seen it healthy, then the old one drains — no request
          # waits or is lost, and a release that never gets healthy never takes
          # traffic (the live one keeps serving; the deploy fails red). Then the web.
          # All of it, every check and every fallback: scripts/deploy/release.sh.
          echo "==> Releasing (API blue/green, then the web)"
          ./release.sh prod </dev/null

          # Healthy: commit the rollback pointer, then drop images we no longer need.
          # We keep the new release + the previous one (for rollback) + the floating
          # :latest, and remove everything older so disk doesn't grow unbounded.
          echo "==> Healthy — recording rollback pointer + pruning stale images"
          echo "$NEW_TAG" > .deploy_current
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$NEW_TAG" ]; then
            echo "$PREV_TAG" > .deploy_previous
          fi
          KEEP=" $NEW_TAG $PREV_TAG latest "
          for repo in "$DOCKER_USERNAME/transactions-api" "$DOCKER_USERNAME/transactions-web"; do
            docker images "$repo" --format '{{.Tag}}' | sort -u | while read -r t; do
              case "$KEEP" in
                *" $t "*) : ;;                                   # keep current/previous/latest
                *) docker rmi "$repo:$t" >/dev/null 2>&1 || true ;;  # in-use ones are skipped
              esac
            done
          done
          docker image prune -f >/dev/null 2>&1 || true

          docker compose -f docker-compose.prod.yml ps
          REMOTE
          )"
          { printf 'DOCKER_SECRET=%q\n' "$DOCKER_SECRET"; printf '%s\n' "$REMOTE_SCRIPT"; } | \
            ssh -i "$KEY" -p "$PORT" $COMMON \
              "$SSH_USER@$HOST" \
              "DEPLOY_DIR='$DEPLOY_DIR' DOCKER_USERNAME='$DOCKER_USERNAME' bash -s"
