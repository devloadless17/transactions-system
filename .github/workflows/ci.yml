name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: txn_app
          POSTGRES_PASSWORD: txn_app_dev_password
          POSTGRES_DB: txn_system
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U txn_app -d txn_system"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      POSTGRES_USER: txn_app
      POSTGRES_PASSWORD: txn_app_dev_password
      POSTGRES_DB: txn_system
      POSTGRES_PORT: 5432
      DATABASE_MIGRATIONS_URL: postgresql://txn_app:txn_app_dev_password@localhost:5432/txn_system?schema=public
      DATABASE_URL: postgresql://txn_app_rls:txn_app_rls_dev_password@localhost:5432/txn_system?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci_access_secret_at_least_32_chars_xxxxxxxxxxxxxxx
      JWT_REFRESH_SECRET: ci_refresh_secret_at_least_32_chars_xxxxxxxxxxxxxx
      CSRF_SECRET: ci_csrf_secret_at_least_32_chars_xxxxxxxxxxxxxxxxxx
      COOKIE_DOMAIN: localhost
      COOKIE_SECURE: 'false'
      WEB_ORIGIN: http://localhost:3000
      ALLOWED_ORIGINS: http://localhost:3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001/v1
      API_INTERNAL_BASE_URL: http://localhost:3001/v1

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm packages:build

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations
        run: pnpm db:migrate:deploy

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Lint workspace
        run: pnpm lint

      - name: Unit tests
        run: pnpm --filter @app/api test

      - name: Build apps
        run: pnpm build
